name: Fix iOS icon

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-ios-icon.yml'
      - '.github/icon-source-1.txt'

permissions:
  contents: write

jobs:
  fix-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Build clean iOS and PWA icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          import base64, io

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          encoded = ''.join(Path('.github/icon-source-1.txt').read_text().split())
          first_pad = encoded.find('=')
          if first_pad != -1:
              end = first_pad + 1
              while end < len(encoded) and encoded[end] == '=':
                  end += 1
              encoded = encoded[:end]

          raw = base64.b64decode(encoded, validate=False)
          source = Image.open(io.BytesIO(raw))
          source.load()
          source = source.convert('RGB')

          if source.width != source.height:
              raise RuntimeError(f'Icon source must be square, got {source.size}')

          print('Decoded icon source:', source.size, source.mode)

          outputs = [
              (180, Path('apple-touch-icon-v6.png')),
              (192, Path('icons/tbr-icon-192-v6.png')),
              (512, Path('icons/tbr-icon-512-v6.png')),
          ]
          for size, path in outputs:
              path.parent.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS).convert('RGB')
              icon.save(path, format='PNG', optimize=True)
              check = Image.open(path)
              check.load()
              if check.size != (size, size) or check.mode != 'RGB':
                  raise RuntimeError(f'Bad generated icon {path}: {check.size} {check.mode}')
              print('Generated', path, check.size, check.mode)
          PY

      - name: Point site at new uncached icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('index.html')
          html = p.read_text()
          html = re.sub(r'<link rel="apple-touch-icon"[^>]*>', '<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v6.png">', html)
          html = re.sub(r'<link rel="icon"[^>]*>', '<link rel="icon" type="image/png" href="./icons/tbr-icon-192-v6.png">', html)
          p.write_text(html)

          p = Path('manifest.json')
          manifest = json.loads(p.read_text())
          manifest['icons'] = [
              {'src':'./icons/tbr-icon-192-v6.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'./icons/tbr-icon-512-v6.png','sizes':'512x512','type':'image/png','purpose':'any'}
          ]
          p.write_text(json.dumps(manifest, indent=2) + '\n')

          p = Path('sw.js')
          sw = p.read_text()
          sw = re.sub(r"const CACHE = '[^']+';", "const CACHE = 'tbr-shell-v6';", sw)
          sw = re.sub(r"const ASSETS = \[[^;]+\];", "const ASSETS = ['./','./index.html','./styles.css','./app.js','./series.js','./manifest.json','./apple-touch-icon-v6.png','./icons/tbr-icon-192-v6.png','./icons/tbr-icon-512-v6.png'];", sw)
          p.write_text(sw)
          PY

      - name: Commit fixed icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apple-touch-icon-v6.png icons/tbr-icon-192-v6.png icons/tbr-icon-512-v6.png index.html manifest.json sw.js
          git diff --cached --quiet || git commit -m 'Use clean RGB iOS Home Screen icon v6'
          git push
